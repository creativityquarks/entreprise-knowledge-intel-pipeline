services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: knowledge_lab
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: tutorial_local_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_lab"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - knowledge_pgdata:/var/lib/postgresql/data
volumes:
  knowledge_pgdata:
