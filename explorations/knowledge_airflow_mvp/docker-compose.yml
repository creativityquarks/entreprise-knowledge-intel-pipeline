x-airflow-common: &airflow-common
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY}
    GCP_PROJECT: ${GCP_PROJECT:?Set GCP_PROJECT}
    BRONZE_BUCKET: ${BRONZE_BUCKET:?Set BRONZE_BUCKET}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/pipeline/src:ro
    - ./fixtures:/opt/pipeline/fixtures:ro
    - ./sql:/opt/pipeline/sql:ro
    - ./tests:/opt/pipeline/tests:ro
    - ./app.py:/opt/pipeline/app.py:ro
    - ./dbt:/opt/pipeline/dbt:ro
    - ./dbt_profiles:/opt/pipeline/dbt_profiles:ro
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        airflow db migrate
        if ! airflow users list | grep -Fq "${AIRFLOW_ADMIN_USERNAME:-admin}"; then
          airflow users create \
            --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
            --firstname Admin --lastname User \
            --role Admin --email admin@example.invalid \
            --password "${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}"
        fi

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    <<: *airflow-common
    command: bash -c "poetry run streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
