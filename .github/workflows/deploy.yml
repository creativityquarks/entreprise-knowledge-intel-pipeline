name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # 1. CI: Run unit tests and data contract validation
  # -------------------------------------------------------------
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r mvp/requirements.txt

      - name: Run Unit Tests
        working-directory: ./mvp
        run: |
          python -m unittest discover -s tests -v

  # -------------------------------------------------------------
  # 2. DevSecOps: Trivy Container Vulnerability & Misconfig Scan
  # -------------------------------------------------------------
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Container Image for Scanning
        run: |
          docker build -t vulnerability-dashboard:scan ./mvp

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerability-dashboard:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true   # Ignores CVEs that don't have an upstream patch yet
          exit-code: '0'         # Change to '1' if you want Critical/High CVEs to block deployment

  # -------------------------------------------------------------
  # 3. CD: Deploy to Cloud Run (only after tests & scan succeed)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy vulnerability-dashboard \
            --source ./mvp \
            --project "ent-knowledge-intel-pipeline" \
            --region europe-west1 \
            --service-account "streamlit-dashboard-sa@ent-knowledge-intel-pipeline.iam.gserviceaccount.com" \
            --set-env-vars "MVP_DEMO=0,GCP_PROJECT_ID=ent-knowledge-intel-pipeline,BQ_DATASET=silver_v4,BQ_GOLD_DATASET=gold_v4,BQ_DEMO_DATASET=silver_v4_demo,BQ_DEMO_GOLD_DATASET=gold_v4_demo,BQ_LOCATION=EU" \
            --allow-unauthenticated
